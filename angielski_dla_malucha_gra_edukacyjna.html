    <style>
        /* Niestandardowe style dla gry edukacyjnej */
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 50%, #fce7f3 100%);
            min-height: 100vh;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Animacje przycisków 3D (efekt wciskania) */
        .btn-3d {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15), 0 10px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15), 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Animacja podskakiwania dla ikon i nagród */
        @keyframes bounce-gentle {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }

        .animate-bounce-gentle {
            animation: bounce-gentle 2.5s infinite ease-in-out;
        }

        /* Animacja potrząsania przy błędnej odpowiedzi (delikatna, nie zniechęcająca) */
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-6deg); }
            75% { transform: rotate(6deg); }
        }

        .animate-wobble {
            animation: wobble 0.4s ease-in-out;
        }

        /* Animacja sukcesu (powiększenie i obrót) */
        @keyframes pop-success {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .animate-pop {
            animation: pop-success 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Pływające chmurki w tle */
        .cloud {
            position: fixed;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Karta koloru - specjalny wygląd */
        .color-swatch {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .color-swatch {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

        let state = {
            currentScreen: 'menu', // 'menu', 'learn', 'quiz', 'match_colors', 'match_numbers'
            selectedCategory: null,

        // INICJALIZACJA DŹWIĘKU (Tone.js)
        let synth = null;
        function initAudio() {
            if (!synth && typeof Tone !== 'undefined') {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -6;
            }
        }

        // Efekty dźwiękowe (fanfary, kliknięcia)
        function playSoundEffect(type) {
            if (!state.soundEnabled) return;
            try {
                initAudio();
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }

                const now = Tone.now();
                if (type === 'click') {
                    synth.triggerAttackRelease("C5", "16n", now);
                } else if (type === 'success') {
                    // Wesoły akord C-dur w górę
                    synth.triggerAttackRelease("C5", "16n", now);
                    synth.triggerAttackRelease("E5", "16n", now + 0.1);
                    synth.triggerAttackRelease("G5", "16n", now + 0.2);
                    synth.triggerAttackRelease("C6", "8n", now + 0.3);
                } else if (type === 'tryAgain') {
                    // Delikatny, przyjazny dźwięk zachęcający do kolejnej próby
                    synth.triggerAttackRelease("E4", "8n", now);
                    synth.triggerAttackRelease("C4", "8n", now + 0.15);
                } else if (type === 'reward') {
                    // Fanfary
                    synth.triggerAttackRelease(["C5", "E5", "G5"], "8n", now);
                    synth.triggerAttackRelease(["D5", "F5", "A5"], "8n", now + 0.2);
                    synth.triggerAttackRelease(["E5", "G5", "B5"], "8n", now + 0.4);
                    synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.6);
                }
            } catch (e) {
                console.warn("Audio playback issue:", e);
            }
        }

        /**
         * SYNTEZATOR MOWY (Web Speech API)
         * Czyta słówka po angielsku, a w razie potrzeby dodaje polskie tłumaczenie.
         */
        function pickKidFriendlyVoice(voices, langPrefix) {
            const matching = voices.filter(v => v.lang.toLowerCase().startsWith(langPrefix.toLowerCase()));
            if (!matching.length) return null;

            const isPolish = langPrefix.toLowerCase().startsWith('pl');

            // Dla języka polskiego preferuj najbardziej naturalne głosy (np. Zofia/Marek Natural, Google Polski)
            // i unikaj mocno zniekształconych głosów robotycznych, jeśli dostępne są lepsze
            const preferredNames = isPolish
                ? [
                    'natural', 'online (natural)', 'zofia', 'marek', 'google polski',
                    'paulina', 'zosia', 'ewa', 'maja'
                  ]
                : [
                    'natural', 'google us english', 'samantha', 'victoria', 'karen', 'moira',
                    'tessa', 'fiona', 'zira', 'aria', 'jenny'
                  ];

            for (const keyword of preferredNames) {
                const found = matching.find(v => v.name.toLowerCase().includes(keyword));
                if (found) return found;
            }

            // Jeśli w systemie jest kilka głosów PL, wybierz ten z dopiskiem 'online' lub 'enhanced'
            const enhanced = matching.find(v =>
                v.name.toLowerCase().includes('online') ||
                v.name.toLowerCase().includes('enhanced') ||
                v.name.toLowerCase().includes('premium')
            );
            if (enhanced) return enhanced;

            return matching[0];
        }

        function speakEnglish(text, polishText = null) {
            if (!state.soundEnabled) return;
            
            if ('speechSynthesis' in window) {
                // Anuluj poprzednią wypowiedź, aby dźwięki nie nakładały się na siebie
                window.speechSynthesis.cancel();

                const voices = window.speechSynthesis.getVoices();

                const utteranceEN = new SpeechSynthesisUtterance(text);
                utteranceEN.lang = 'en-US';
                utteranceEN.rate = 0.78; // Spokojne, wyraźne tempo idealne dla przedszkolaka
                utteranceEN.pitch = 1.28; // Cieplejsza, bardziej dziecięca/przyjazna wysokość głosu

                const englishVoice = pickKidFriendlyVoice(voices, 'en');
                if (englishVoice) {
                    utteranceEN.voice = englishVoice;
                }

                // Jeśli przekazano polskie tłumaczenie (tryb EN -> PL), odtwórz je zaraz po angielskim
                if (polishText && state.bilingualMode) {
                    utteranceEN.onend = () => {
                        if (!state.soundEnabled) return;
                        const utterancePL = new SpeechSynthesisUtterance(polishText);
                        utterancePL.lang = 'pl-PL';
                        // Bardziej naturalne tempo i łagodniejsza wysokość głosu brzmią znacznie bardziej po ludzku
                        utterancePL.rate = 0.96;
                        utterancePL.pitch = 1.04;

                        const polishVoice = pickKidFriendlyVoice(voices, 'pl');
                        if (polishVoice) {
                            utterancePL.voice = polishVoice;
                        }
                        window.speechSynthesis.speak(utterancePL);
                    };
                }

                window.speechSynthesis.speak(utteranceEN);
            }
        }

        // Załaduj głosy syntezatora po inicjalizacji
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Przełączanie trybu dwujęzycznego (EN -> PL vs tylko EN)
        function toggleBilingual() {

        // Przełączanie dźwięku
        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            if (!state.soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();

            const btn = document.getElementById('sound-toggle');
            btn.innerHTML = state.soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('bg-sky-400', state.soundEnabled);
            btn.classList.toggle('bg-gray-400', !state.soundEnabled);
            if (state.soundEnabled) playSoundEffect('click');
        }

            if (state.quizStreak > 0 && state.quizStreak % 5 === 0) {

        // PRZEŁĄCZANIE MIĘDZY NAUKĄ A ZABAWĄ (QUIZEM LUB DOPASOWYWANIEM)
        function setMode(mode) {
            playSoundEffect('click');
            state.currentScreen = mode;
            state.matchSelectedColor = null;

            if (mode === 'quiz') {

        // 3. TRYB ZABAWY / QUIZU ("Znajdź właściwy obrazek")
        function nextQuizQuestion() {
            state.isAnswering = false;
            const items = state.selectedCategory.items;
            
            // Wylosuj poprawne słowo (inne niż poprzednie, jeśli to możliwe)
            let target;
            do {
                target = items[Math.floor(Math.random() * items.length)];
            } while (items.length > 1 && target === state.quizTarget);
            
            state.quizTarget = target;

            // Wylosuj 2 lub 3 inne opcje (dla 4-latka 3 karty na ekranie są idealne - nie przytłaczają!)
            const numOptions = Math.min(3, items.length);
            const options = [target];
            
            while (options.length < numOptions) {
                const randomItem = items[Math.floor(Math.random() * items.length)];
                if (!options.includes(randomItem)) {
                    options.push(randomItem);
                }
            }

            // Pomieszaj kolejność kart
            state.quizOptions = options.sort(() => Math.random() - 0.5);

            render();
            
            // Wypowiedz pytanie po krótkiej chwili
            setTimeout(() => {
                speakEnglish(state.quizTarget.en);
            }, 300);
        }

                let visual = '';
                if (state.selectedCategory.id === 'colors') {
                    visual = `<div class="color-swatch" style="background-color: ${option.colorHex};"></div>`;
                } else if (state.selectedCategory.id === 'numbers') {
                    visual = `
                        <div class="text-6xl sm:text-7xl">${option.emoji}</div>
                        <div class="text-lg tracking-widest">${option.countEmoji}</div>
                    `;
                } else {
                    visual = `<div class="text-7xl sm:text-8xl">${option.emoji}</div>`;
                }

                btn.innerHTML = `
                    ${visual}
                    <div class="text-xl font-bold text-gray-400 sm:hidden">${option.pl}</div>
                `;
                if (state.selectedCategory.id === 'color_rhyme') {
                    btn.innerHTML = `
                        ${visual}
                        <div class="text-base font-bold text-indigo-700">${option.en}</div>
                    `;
                }

                btn.onclick = () => handleQuizAnswer(option, btn);
                optionsGrid.appendChild(btn);
            });

            wrapper.appendChild(optionsGrid);
            container.appendChild(wrapper);
        }

        // Sprawdzanie odpowiedzi dziecka
        function handleQuizAnswer(selectedOption, cardElement) {
            if (state.isAnswering) return;

            if (selectedOption.en === state.quizTarget.en) {
                // POPRAWNA ODPOWIEDŹ!
                state.isAnswering = true;
                playSoundEffect('success');
                speakEnglish(`Great! ${selectedOption.en}!`);
                
                cardElement.classList.remove('border-indigo-200', 'bg-white');
                cardElement.classList.add('border-green-500', 'bg-green-100', 'animate-pop');
                
                // Dodaj napis z nazwą po sukcesie
                const label = document.createElement('div');
                label.className = 'text-2xl font-bold text-green-700 mt-2';
                label.textContent = selectedOption.pl ? `${selectedOption.en} (${selectedOption.pl})! 🎉` : `${selectedOption.en}! 🎉`;
                cardElement.appendChild(label);

                addStar();

                // Przejdź do kolejnego pytania (jeśli nie otworzył się modal z nagrodą)
                if (state.quizStreak % 5 !== 0) {
                    setTimeout(() => {
                        nextQuizQuestion();
                    }, 1600);
                }
            } else {
                // BŁĘDNA ODPOWIEDŹ (Delikatna informacja zwrotna)
                playSoundEffect('tryAgain');
                speakEnglish(`No, that's ${selectedOption.en}. Try again!`);
                
                cardElement.classList.remove('border-indigo-200');
                cardElement.classList.add('border-rose-300', 'bg-rose-50', 'animate-wobble', 'opacity-60');
                
                setTimeout(() => {
                    cardElement.classList.remove('animate-wobble');
                }, 400);
            }
        }

        // 4. GRA DOPASOWYWANIA KOLORÓW Z ANGIELSKĄ NAZWĄ DO OBRAZKA
        let colorMatchObjects = [];
        let colorMatchTargets = [];

        function initColorMatchGame() {
            const colorsCat = CATEGORIES.find(c => c.id === 'colors');
            // Wybierz 4 losowe kolory do rundy, aby plansza była przejrzysta dla 4-latka
            const shuffled = [...colorsCat.items].sort(() => Math.random() - 0.5);
            const roundColors = shuffled.slice(0, 4);

            colorMatchTargets = [...roundColors].sort(() => Math.random() - 0.5);
            colorMatchObjects = [...roundColors].sort(() => Math.random() - 0.5);
            state.matchSelectedColor = null;
            state.matchMatchedIds = [];
            render();
        }

        function renderColorMatchMode(container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'w-full flex flex-col items-center';

            wrapper.appendChild(createModeSwitcher());

            const instruction = document.createElement('div');
            instruction.className = 'bg-white/95 border-4 border-pink-300 rounded-3xl px-5 py-3 mb-5 text-center shadow max-w-2xl w-full';
            instruction.innerHTML = `
                <div class="text-lg sm:text-2xl font-bold text-indigo-700">
                    Kliknij kolor po angielsku, a potem pasujący obrazek! 🎨➡️🍎
                </div>
                <div class="text-xs sm:text-sm text-gray-500 mt-0.5">
                    Dopasowano w tej rundzie: <span class="font-bold text-pink-600">${state.matchMatchedIds.length} / ${colorMatchTargets.length}</span>
                </div>
            `;
            wrapper.appendChild(instruction);

            const board = document.createElement('div');
            board.className = 'grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-8 w-full max-w-3xl';

            // Lewa kolumna: Kolory z angielską nazwą
            const leftCol = document.createElement('div');
            leftCol.className = 'bg-white/80 border-4 border-white rounded-3xl p-4 flex flex-col gap-3 shadow-md';
            leftCol.innerHTML = `<div class="text-center font-bold text-indigo-600 text-lg mb-1">1. Wybierz kolor (English)</div>`;

            colorMatchTargets.forEach(item => {
                const isMatched = state.matchMatchedIds.includes(item.en);
                const isSelected = state.matchSelectedColor && state.matchSelectedColor.en === item.en;

                const btn = document.createElement('button');
                btn.disabled = isMatched;
                btn.className = `btn-3d w-full rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 border-4 transition-all ${
                    isMatched
                        ? 'bg-green-100 border-green-400 opacity-70 cursor-default'
                        : isSelected
                            ? 'bg-amber-100 border-amber-500 ring-4 ring-amber-300 scale-[1.02]'
                            : 'bg-white hover:bg-pink-50 border-indigo-100 cursor-pointer'
                }`;

                btn.onclick = () => {
                    if (isMatched) return;
                    playSoundEffect('click');
                    state.matchSelectedColor = item;
                    speakEnglish(item.en);
                    render();
                };

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-4 border-white shadow shrink-0" style="background-color: ${item.colorHex};"></span>
                        <span class="text-2xl sm:text-3xl font-bold text-indigo-700">${item.en}</span>
                    </div>
                    <span class="text-2xl">${isMatched ? '✅' : (isSelected ? '👉' : '🔊')}</span>
                `;
                leftCol.appendChild(btn);
            });

            // Prawa kolumna: Przedmioty / owoce / zwierzątka o danym kolorze
            const rightCol = document.createElement('div');
            rightCol.className = 'bg-white/80 border-4 border-white rounded-3xl p-4 flex flex-col gap-3 shadow-md';
            rightCol.innerHTML = `<div class="text-center font-bold text-indigo-600 text-lg mb-1">2. Dopasuj obrazek</div>`;

            colorMatchObjects.forEach(item => {
                const isMatched = state.matchMatchedIds.includes(item.en);

                const objBtn = document.createElement('button');
                objBtn.disabled = isMatched;
                objBtn.className = `btn-3d w-full rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 border-4 transition-all ${
                    isMatched
                        ? 'bg-green-100 border-green-400 opacity-75 cursor-default'
                        : 'bg-white hover:bg-yellow-50 border-indigo-100 cursor-pointer'
                }`;

                objBtn.onclick = () => handleColorObjectClick(item, objBtn);

                objBtn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="text-4xl sm:text-5xl">${item.emoji}</span>
                        <div class="text-left">
                            <div class="text-lg sm:text-xl font-bold text-gray-700">${isMatched ? item.en : '???'}</div>
                            <div class="text-xs sm:text-sm text-gray-400">${isMatched ? item.pl : 'Dotknij, aby dopasować'}</div>
                        </div>
                    </div>
                    <span class="text-2xl">${isMatched ? '⭐' : '❓'}</span>
                `;
                rightCol.appendChild(objBtn);
            });

            board.appendChild(leftCol);
            board.appendChild(rightCol);
            wrapper.appendChild(board);

            // Przycisk nowej rundy
            const newRoundBtn = document.createElement('button');
            newRoundBtn.onclick = () => {
                playSoundEffect('click');
                initColorMatchGame();
            };
            newRoundBtn.className = 'btn-3d mt-6 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-lg px-6 py-3 rounded-2xl';
            newRoundBtn.textContent = '🔄 Nowe kolory';
            wrapper.appendChild(newRoundBtn);

            container.appendChild(wrapper);
        }

        function handleColorObjectClick(objItem, cardEl) {
            if (!state.matchSelectedColor) {
                playSoundEffect('tryAgain');
                speakEnglish("First pick a color word!");
                cardEl.classList.add('animate-wobble');
                setTimeout(() => cardEl.classList.remove('animate-wobble'), 400);
                return;
            }

            if (state.matchSelectedColor.en === objItem.en) {
                // Trafione dopasowanie!
                playSoundEffect('success');
                speakEnglish(`${objItem.en}! Good job!`);
                state.matchMatchedIds.push(objItem.en);
                state.matchSelectedColor = null;
                addStar();

                if (state.matchMatchedIds.length === colorMatchTargets.length) {
                    setTimeout(() => {
                        initColorMatchGame();
                    }, 1300);
                } else {
                    render();
                }
            } else {
                // Nie ten kolor
                playSoundEffect('tryAgain');
                speakEnglish(`Try again! Find ${state.matchSelectedColor.en}!`);
                cardEl.classList.add('animate-wobble', 'bg-rose-50', 'border-rose-300');
                setTimeout(() => {
                    cardEl.classList.remove('animate-wobble', 'bg-rose-50', 'border-rose-300');
                }, 450);
            }
        }

        // Powitanie głosowe asystenta Pandy
        let pandaHasGreeted = false;
        function pandaGreet() {
            playSoundEffect('click');
            speakEnglish("Hello! I am Panda! Let's play and learn English!", "Cześć! Jestem Panda! Pobawmy się razem po angielsku!");
        }

        // 5. GRA DOPASOWUJĄCA LICZBĘ PO ANGIELSKU DO ILOŚCI PRZEDMIOTÓW NA OBRAZKU
        let numberMatchTargets = [];
        let numberMatchObjects = [];

        function initNumberMatchGame() {
            const numbersCat = CATEGORIES.find(c => c.id === 'numbers');
            // Wybierz 4 losowe liczby do rundy, aby plansza była czytelna dla czterolatka
            const shuffled = [...numbersCat.items].sort(() => Math.random() - 0.5);
            const roundNumbers = shuffled.slice(0, 4);

            numberMatchTargets = [...roundNumbers].sort(() => Math.random() - 0.5);
            numberMatchObjects = [...roundNumbers].sort(() => Math.random() - 0.5);
            state.matchSelectedNumber = null;
            state.matchMatchedNumbers = [];
            render();
        }

        function renderNumberMatchMode(container) {
            const wrapper = document.createElement('div');
            wrapper.className = 'w-full flex flex-col items-center';

            wrapper.appendChild(createModeSwitcher());

            const instruction = document.createElement('div');
            instruction.className = 'bg-white/95 border-4 border-sky-300 rounded-3xl px-5 py-3 mb-5 text-center shadow max-w-2xl w-full';
            instruction.innerHTML = `
                <div class="text-lg sm:text-2xl font-bold text-indigo-700">
                    Kliknij liczbę po angielsku, a potem obrazek z tyloma przedmiotami! 🔢➡️🎈
                </div>
                <div class="text-xs sm:text-sm text-gray-500 mt-0.5">
                    Dopasowano w tej rundzie: <span class="font-bold text-sky-600">${state.matchMatchedNumbers.length} / ${numberMatchTargets.length}</span>
                </div>
            `;
            wrapper.appendChild(instruction);

            const board = document.createElement('div');
            board.className = 'grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-8 w-full max-w-3xl';

            // Lewa kolumna: Liczba z nazwą po angielsku
            const leftCol = document.createElement('div');
            leftCol.className = 'bg-white/80 border-4 border-white rounded-3xl p-4 flex flex-col gap-3 shadow-md';
            leftCol.innerHTML = `<div class="text-center font-bold text-indigo-600 text-lg mb-1">1. Wybierz liczbę (English)</div>`;

            numberMatchTargets.forEach(item => {
                const isMatched = state.matchMatchedNumbers.includes(item.en);
                const isSelected = state.matchSelectedNumber && state.matchSelectedNumber.en === item.en;

                const btn = document.createElement('button');
                btn.disabled = isMatched;
                btn.className = `btn-3d w-full rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 border-4 transition-all ${
                    isMatched
                        ? 'bg-green-100 border-green-400 opacity-70 cursor-default'
                        : isSelected
                            ? 'bg-amber-100 border-amber-500 ring-4 ring-amber-300 scale-[1.02]'
                            : 'bg-white hover:bg-sky-50 border-indigo-100 cursor-pointer'
                }`;

                btn.onclick = () => {
                    if (isMatched) return;
                    playSoundEffect('click');
                    state.matchSelectedNumber = item;
                    speakEnglish(item.en);
                    render();
                };

                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-3xl sm:text-4xl">${item.emoji}</span>
                        <span class="text-2xl sm:text-3xl font-bold text-indigo-700">${item.en}</span>
                    </div>
                    <span class="text-2xl">${isMatched ? '✅' : (isSelected ? '👉' : '🔊')}</span>
                `;
                leftCol.appendChild(btn);
            });

            // Prawa kolumna: Obrazki z liczbą przedmiotów do przeliczenia
            const rightCol = document.createElement('div');
            rightCol.className = 'bg-white/80 border-4 border-white rounded-3xl p-4 flex flex-col gap-3 shadow-md';
            rightCol.innerHTML = `<div class="text-center font-bold text-indigo-600 text-lg mb-1">2. Policz i dopasuj obrazek</div>`;

            numberMatchObjects.forEach(item => {
                const isMatched = state.matchMatchedNumbers.includes(item.en);

                const objBtn = document.createElement('button');
                objBtn.disabled = isMatched;
                objBtn.className = `btn-3d w-full rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 border-4 transition-all ${
                    isMatched
                        ? 'bg-green-100 border-green-400 opacity-75 cursor-default'
                        : 'bg-white hover:bg-yellow-50 border-indigo-100 cursor-pointer'
                }`;

                objBtn.onclick = () => handleNumberObjectClick(item, objBtn);

                objBtn.innerHTML = `
                    <div class="flex flex-col items-start gap-1 text-left">
                        <div class="text-xl sm:text-2xl tracking-wider leading-snug">${item.countEmoji}</div>
                        <div class="text-xs sm:text-sm font-semibold text-gray-500">
                            ${isMatched ? `${item.en} (${item.pl})` : 'Policz przedmioty i kliknij'}
                        </div>
                    </div>
                    <span class="text-2xl shrink-0">${isMatched ? '⭐' : '❓'}</span>
                `;
                rightCol.appendChild(objBtn);
            });

            board.appendChild(leftCol);
            board.appendChild(rightCol);
            wrapper.appendChild(board);

            // Przycisk nowej rundy
            const newRoundBtn = document.createElement('button');
            newRoundBtn.onclick = () => {
                playSoundEffect('click');
                initNumberMatchGame();
            };
            newRoundBtn.className = 'btn-3d mt-6 bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold text-lg px-6 py-3 rounded-2xl';
            newRoundBtn.textContent = '🔄 Nowe liczby';
            wrapper.appendChild(newRoundBtn);

            container.appendChild(wrapper);
        }

        function handleNumberObjectClick(objItem, cardEl) {
            if (!state.matchSelectedNumber) {
                playSoundEffect('tryAgain');
                speakEnglish("First pick a number word!");
                cardEl.classList.add('animate-wobble');
                setTimeout(() => cardEl.classList.remove('animate-wobble'), 400);
                return;
            }

            if (state.matchSelectedNumber.en === objItem.en) {
                // Poprawne dopasowanie liczby do ilości przedmiotów
                playSoundEffect('success');
                speakEnglish(`${objItem.en}! Good job!`);
                state.matchMatchedNumbers.push(objItem.en);
                state.matchSelectedNumber = null;
                addStar();

                if (state.matchMatchedNumbers.length === numberMatchTargets.length) {
                    setTimeout(() => {
                        initNumberMatchGame();
                    }, 1300);
                } else {
                    render();
                }
            } else {
                // Zła liczba przedmiotów
                playSoundEffect('tryAgain');
                speakEnglish(`Try again! Find ${state.matchSelectedNumber.en}!`);
                cardEl.classList.add('animate-wobble', 'bg-rose-50', 'border-rose-300');
                setTimeout(() => {
                    cardEl.classList.remove('animate-wobble', 'bg-rose-50', 'border-rose-300');
                }, 450);
            }
        }

        // Start aplikacji po załadowaniu strony
        window.onload = () => {
            updateHeader();
            render();

            // Automatyczne powitanie przy pierwszym wejściu lub pierwszym dotknięciu ekranu (wymóg przeglądarek dla dźwięku)
            const autoGreetOnce = () => {
                if (!pandaHasGreeted) {
                    pandaHasGreeted = true;
                    pandaGreet();
                }
                document.removeEventListener('click', autoGreetOnce);
                document.removeEventListener('touchstart', autoGreetOnce);
            };

            // Spróbuj od razu przywitać głosowo
            setTimeout(() => {
                if (!pandaHasGreeted && 'speechSynthesis' in window) {
                    pandaHasGreeted = true;
                    speakEnglish("Hello! I am Panda! Let's play!", "Cześć! Jestem Panda!");
                }
            }, 500);

            document.addEventListener('click', autoGreetOnce, { once: true });
            document.addEventListener('touchstart', autoGreetOnce, { once: true });
        };
    </script>
</body>
</html>
